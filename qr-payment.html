<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>SCAN & PAY</title>

    <style>

        * {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: transparent;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body {
    display: flex;

    align-items: center;
    justify-content: center;
}

.qr-window {
    position: relative;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 0;

    background: transparent;
}

/* =========================================
   QR BOX
========================================= */

#qr-image-box {
    width: 260px;
    height: 260px;

    background: #ffffff;

    border-radius: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}

#qr-payment-image {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;
}

/* =========================================
   TIMER
========================================= */

#qr-payment-timer {
    margin-top: 0;

    color: #000000;

    font-family: monospace;

    font-size: 12px;

    font-weight: 700;

    line-height: 14px;
}

        /* =========================================
           STATUS
        ========================================= */

        #qr-payment-status {

            margin-top: 8px;

            color: #8fa8c2;

            font-size: 13px;

            text-align: center;
        }

    </style>

</head>

<body>

    <div class="qr-window">


        <!-- QR -->

        <div id="qr-image-box">

            <img
                id="qr-payment-image"
                src=""
                alt="Payment QR"
            >

        </div>

        <!-- TIMER -->

        <div id="qr-payment-timer">
            00:00
        </div>

    </div>


    <script>

        // =========================================
        // QR SHOW
        // =========================================

        if (
            window.electronAPI &&
            window.electronAPI.onPaymentQR
        ) {

            window.electronAPI.onPaymentQR(
                function(qrData) {

                    const image =
                        document.getElementById(
                            'qr-payment-image'
                        );

                    const timer =
                        document.getElementById(
                            'qr-payment-timer'
                        );


                    if (
                        qrData &&
                        qrData.image
                    ) {

                        image.src =
                            qrData.image;

                        if (timer) {

                            timer.textContent =
                                qrData.remainingTime ||
                                '00:00';
                        }


                        console.log(
                            '[QR WINDOW] QR received.'
                        );
                    }

                }
            );
        }


        // =========================================
        // LIVE TIMER
        // =========================================

        if (
            window.electronAPI &&
            window.electronAPI.onPaymentQRTimer
        ) {

            window.electronAPI.onPaymentQRTimer(
                function(data) {

                    const timer =
                        document.getElementById(
                            'qr-payment-timer'
                        );

                    if (
                        timer &&
                        data &&
                        data.remainingTime
                    ) {

                        timer.textContent =
                            data.remainingTime;
                    }

                }
            );
        }


        // =========================================
        // PAYMENT SUCCESS / FAILED
        // =========================================

        if (
            window.electronAPI &&
            window.electronAPI.onPaymentQRHide
        ) {

            window.electronAPI.onPaymentQRHide(
                function() {

                    console.log(
                        '[QR WINDOW] Payment completed. Closing QR window.'
                    );

                    window.close();

                }
            );
        }

    </script>

</body>

</html>
