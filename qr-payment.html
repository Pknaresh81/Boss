<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>SCAN & PAY</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

        body {
            display: flex;

            align-items: center;
            justify-content: center;
        }

        .qr-window {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    width: 284px;
    min-height: 340px;
    padding: 10px 12px;

    background: #ffffff;
    box-sizing: border-box;
}

        /* =========================================
           QR BOX
        ========================================== */

        #qr-image-box {
            width: 260px;
            height: 260px;

            background: #ffffff;

            border-radius: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        #qr-payment-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
            background: #ffffff;
        }

        /* Razorpay QR: sharper nearest-neighbour scaling */
        #qr-payment-image.razorpay-qr {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* =========================================
           PAYMENT AMOUNT
        ========================================== */

        #qr-payment-amount {
            color: #16a34a;
            font-size: 20px;
            font-weight: 800;
            line-height: 26px;
            margin-top: 5px;
            text-align: center;
        }

        /* =========================================
           TIMER
        ========================================== */

        #qr-payment-timer {
            margin-top: 0;

            color: #000000;

            font-family: monospace;

            font-size: 12px;

            font-weight: 700;

            line-height: 14px;
        }

        /* =========================================
           STATUS
        ========================================== */

        #qr-payment-status {

            margin-top: 8px;

            color: #8fa8c2;

            font-size: 13px;

            text-align: center;
        }

    </style>

</head>

<body>

    <div class="qr-window">

        <!-- QR -->

        <div id="qr-image-box">

            <img
                id="qr-payment-image"
                src=""
                alt="Payment QR"
            >

        </div>

        <!-- PAYMENT AMOUNT -->

        <div id="qr-payment-amount">
            Amount: ₹--
        </div>

        <!-- TIMER -->

        <div id="qr-payment-timer">
            00:00
        </div>

    </div>


    <script>

        // =========================================
        // QR SHOW - IMAGE LOAD VALIDATION
        // =========================================

        if (
            window.electronAPI &&
            window.electronAPI.onPaymentQR
        ) {
            window.electronAPI.onPaymentQR(
                function(qrData) {

                    const image =
                        document.getElementById('qr-payment-image');

                    const timer =
                        document.getElementById('qr-payment-timer');

                    const amount =
                        document.getElementById('qr-payment-amount');

                    if (!qrData || !qrData.image) {
                        console.error(
                            '[QR WINDOW] QR data/image missing.'
                        );
                        return;
                    }

                    // Purani image ke handlers clear karein
                    image.onload = null;
                    image.onerror = null;

                    image.style.visibility = 'hidden';

                    image.onload = function() {
                        if (
                            image.naturalWidth > 0 &&
                            image.naturalHeight > 0
                        ) {
                            image.style.visibility = 'visible';

                            console.log(
                                '[QR WINDOW] Image loaded successfully:',
                                image.naturalWidth,
                                'x',
                                image.naturalHeight
                            );
                        } else {
                            console.error(
                                '[QR WINDOW] Image loaded but dimensions invalid.'
                            );
                        }
                    };

                    image.onerror = function() {
                        image.style.visibility = 'hidden';

                        console.error(
                            '[QR WINDOW] Image load failed. Source length:',
                            String(image.src || '').length
                        );
                    };

                    image.classList.toggle(
                        'razorpay-qr',
                        String(qrData.paymentType || '')
                            .trim()
                            .toUpperCase()
                            .startsWith('RAZORPAY')
                    );

                    image.src = qrData.image;

                    // PAYMENT AMOUNT UPDATE
                    if (amount) {

                        const value = String(qrData.amount || '')
                            .replace(/[^\d,.]/g, '')
                            .trim();

                        amount.textContent = value
                            ? 'Amount: ₹' + value
                            : 'Amount: --';

                    }

                    if (timer) {
                        timer.textContent =
                            qrData.remainingTime || '00:00';
                    }

                    console.log(
                        '[QR WINDOW] QR data received. Image loading...'
                    );
                }
            );
        }


        // =========================================
        // LIVE TIMER
        // =========================================

        if (
            window.electronAPI &&
            window.electronAPI.onPaymentQRTimer
        ) {

            window.electronAPI.onPaymentQRTimer(
                function(data) {

                    const timer =
                        document.getElementById(
                            'qr-payment-timer'
                        );

                    if (
                        timer &&
                        data &&
                        data.remainingTime
                    ) {

                        timer.textContent =
                            data.remainingTime;
                    }

                }
            );
        }


        // =========================================
        // PAYMENT SUCCESS / FAILED
        // =========================================

        if (
            window.electronAPI &&
            window.electronAPI.onPaymentQRHide
        ) {

            window.electronAPI.onPaymentQRHide(
                function() {

                    console.log(
                        '[QR WINDOW] Payment completed. Closing QR window.'
                    );

                    window.close();

                }
            );
        }

    </script>

</body>

</html>
