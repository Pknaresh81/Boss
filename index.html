<script>

/* =========================================================
   ELECTRON IPC & PROGRESS LISTENER (Updated)
========================================================= */

let ipcRenderer = null;

try {
    if (typeof require === "function") {
        const electron = require("electron");
        ipcRenderer = electron.ipcRenderer;
    }
} catch (error) {
    console.warn("Electron IPC not available:", error);
}

// Live Progress Listener from apiengine.js
if (ipcRenderer) {
    ipcRenderer.on('booking-progress', (event, data) => {
        console.log('[Boss] Progress received:', data);
        if (data && data.winId) {
            const statusBanner = document.getElementById(data.winId + '-status');
            const resultTag = document.getElementById(data.winId + '-result');
            
            if (statusBanner) {
                if (data.step && data.step.toLowerCase() === 'error') {
                    statusBanner.style.background = '#dc2626';
                    statusBanner.innerText = String(data.message || 'ERROR').toUpperCase();
                } else {
                    statusBanner.style.background = '#2563eb';
                    statusBanner.innerText = String(data.step || 'PROCESSING').toUpperCase();
                }
            }

            if (resultTag) {
                resultTag.innerText = String(data.message || data.step || 'RUNNING');
                resultTag.style.background = data.step && data.step.toLowerCase() === 'error' ? '#fecaca' : '#fef08a';
            }
        }
    });
}

/* =========================================================
   CAPTCHA LISTENERS
========================================================= */

let activeCaptchaBrowser = 'WEB';

if (
    window.electronAPI &&
    typeof window.electronAPI.onShowCaptcha === "function"
) {
    window.electronAPI.onShowCaptcha((data) => {

        const captchaImgElement =
            document.getElementById('captcha-img');

        const captchaModal =
            document.getElementById('captcha-modal');

        const captchaInput =
            document.getElementById('captcha-input');

        activeCaptchaBrowser =
            String(
                data?.browserType || 'WEB'
            ).trim().toUpperCase();

        const image =
            data?.image || '';

        console.log(
            `[CAPTCHA ${activeCaptchaBrowser}] Captcha received.`
        );

        if (
            captchaImgElement &&
            captchaModal
        ) {
            captchaImgElement.src = image;
            captchaModal.style.display = 'flex';

            if (captchaInput) {
                captchaInput.value = '';
                captchaInput.focus();
            }
        }
    });
}

document.addEventListener(
    'DOMContentLoaded',
    () => {

        const submitCaptchaBtn =
            document.getElementById(
                'submit-captcha-btn'
            );

        if (!submitCaptchaBtn) return;

        submitCaptchaBtn.addEventListener(
            'click',
            () => {

                const input =
                    document.getElementById(
                        'captcha-input'
                    );

                const userCaptchaText =
                    String(
                        input?.value || ''
                    ).trim();

                if (!userCaptchaText) {
                    return;
                }

                console.log(
                    `[CAPTCHA ${activeCaptchaBrowser}] Submitting captcha.`
                );

                if (
                    window.electronAPI &&
                    typeof window.electronAPI.submitCaptcha ===
                        "function"
                ) {
                    window.electronAPI.submitCaptcha(
                        userCaptchaText,
                        activeCaptchaBrowser
                    );
                }

                const captchaModal =
                    document.getElementById(
                        'captcha-modal'
                    );

                if (captchaModal) {
                    captchaModal.style.display =
                        'none';
                }
            }
        );
    }
);

/* =========================================================
   CLOCK
========================================================= */

setInterval(() => {

    const now = new Date();

    const timeString =
        now.toTimeString().split(" ")[0];

    const clockEl =
        document.getElementById("live-clock");

    if (clockEl) {
        clockEl.innerText = timeString;
    }

    document
        .querySelectorAll(".mini-clock")
        .forEach(el => {
            el.innerText = timeString;
        });

}, 1000);


/* =========================================================
   STORAGE HELPERS
========================================================= */

function loadStorage(key, fallback) {

    try {

        const data =
            localStorage.getItem(key);

        if (!data) {
            return fallback;
        }

        return JSON.parse(data);

    } catch (error) {

        console.error(
            "Storage read error:",
            error
        );

        return fallback;
    }
}


function saveStorage(key, value) {

    try {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    } catch (error) {

        console.error(
            "Storage write error:",
            error
        );
    }
}


/* =========================================================
   DATA
========================================================= */

let ticketsQueue =
    loadStorage("Boss_tickets_queue", []);


let irctcAccounts =
    loadStorage(
        "Boss_irctc_accounts",
        []

let paymentMethods =
    loadStorage(

        []
    );


let tokensList =
    loadStorage(
        "Boss_tokens",
        ["Boss_TOKEN_SECURE_9982"]
    );


let latestSavedTicket = null;

let editingTicketIndex = -1;


/* =========================================================
   PASSENGER INPUTS
========================================================= */

function renderPassengerInputs() {

    const container =
        document.getElementById(
            "passengers-rows-container"
        );

    if (!container) return;

    let html = "";

    for (let i = 1; i <= 6; i++) {

        html += `

        <div class="grid grid-cols-4 gap-2 bg-slate-50 p-2 rounded border border-slate-200">

            <div>
                <label class="text-slate-600 block mb-1 text-[10px]">
                    Name ${i}
                </label>

                <input
                    type="text"
                    id="p-name-${i}"
                    placeholder="Name"
                    class="w-full bg-white border border-slate-300 rounded p-1 text-slate-800"
                >
            </div>


            <div>
                <label class="text-slate-600 block mb-1 text-[10px]">
                    Age ${i}
                </label>

                <input
                    type="number"
                    id="p-age-${i}"
                    placeholder="Age"
                    class="w-full bg-white border border-slate-300 rounded p-1 text-slate-800"
                >

========================================================= */

function saveTicketToQueue() {

    const train = document.getElementById("inp-train").value.trim();
    const from = document.getElementById("inp-from").value.trim();
    const to = document.getElementById("inp-to").value.trim();

    const quota = String(
        document.getElementById("inp-quota")?.value || ""
    ).trim().toUpperCase();

    const cls = document.getElementById("inp-class").value;
    const bookingDate = document.getElementById("bookingDate").value;
    const irctc = document.getElementById("inp-irctc").value;
    const payment = document.getElementById("inp-pay").value;
    const mobile = document.getElementById("mobileNumber").value.trim();
    const confirmedOnly = document.getElementById("confirmedOnly").checked;

    if (!train || !from || !to) {
        alert("Please fill the required train details!");
        return;
    }

    const passengersList = [];

    for (let i = 1; i <= 6; i++) {

        const nameElement = document.getElementById(`p-name-${i}`);
        if (!nameElement) continue;

        const name = nameElement.value.trim();

 if (name !== "") {
 passengersList.push({
    name,
    age: document.getElementById(`p-age-${i}`).value,
    gender: document.getElementById(`p-gender-${i}`).value,
    berth: document.getElementById(`p-berth-${i}`).value
});
        }
    }

    if (!passengersList.length) {
        alert("Please add at least one passenger name!");
        return;
    }

    const oldTicket =
        editingTicketIndex >= 0
            ? ticketsQueue[editingTicketIndex]
            : null;

    const ticket = {
        id: oldTicket?.id || (
            "ticket_" +
            Date.now() +
            "_" +
            Math.random().toString(36).substring(2, 8)
        ),

        train,
        from,
        to,
        quota,
        class: cls,
        bookingDate,
        payment,
        mobile,
        confirmedOnly,
        passengers: passengersList,
        irctc,

        createdAt:
            oldTicket?.createdAt ||
            new Date().toISOString()
    };

    if (editingTicketIndex >= 0) {

        ticketsQueue[editingTicketIndex] = ticket;
        latestSavedTicket = ticket;

        saveStorage(
            "Boss_tickets_queue",
            ticketsQueue
        );

        editingTicketIndex = -1;

        renderTickets();

        alert(
            "Ticket Updated Successfully!\n\n" +
            train + " : " + from + " → " + to
        );

    } else {

        ticketsQueue.push(ticket);
        latestSavedTicket = ticket;

        saveStorage(
            "Boss_tickets_queue",
            ticketsQueue
        );

        renderTickets();

        alert(
            "Ticket Saved Successfully!\n\n" +
            train + " : " + from + " → " + to
        );
    }

    toggleTab("tickets");
}

/* =========================================================
   DELETE TICKET
========================================================= */

function removeTicket(idx) {

    if (
        idx < 0 ||
        idx >= ticketsQueue.length
    ) {
        return;
    }


    const removed =
        ticketsQueue[idx];


    if (
        !confirm(
            `Delete ticket ${removed.train} ${removed.from} → ${removed.to}?`
        )
    ) {
        return;
    }


    ticketsQueue.splice(idx, 1);


    saveStorage(
        "Boss_tickets_queue",
        ticketsQueue
    );


    if (
        latestSavedTicket &&
        latestSavedTicket.id === removed.id
    ) {
        latestSavedTicket = null;
    }


    renderTickets();
}

function addIrctcAccount() {
    const userInput =
        document.getElementById("profile-user");

    const passInput =
        document.getElementById("profile-pass");

    const user =
        userInput.value.trim();

    const password =
        passInput.value;

    if (!user) {
        alert("Enter username");
        return;
    }

    if (!password) {
        alert("Enter password");
        return;
    }

    const exists =
        Array.isArray(irctcAccounts) &&
        irctcAccounts.some(account =>
            typeof account === "string"
                ? account === user
                : String(account?.username || "").trim() === user
        );

    if (exists) {
        alert("Account already exists.");
        return;
    }

    irctcAccounts.push({
        username: user,
        password: password
    });

    saveStorage(
        "Boss_irctc_accounts",
        irctcAccounts
    );

    renderProfiles();

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            resizeDashboardWindow();
        });
    });

    userInput.value = "";
    passInput.value = "";
}

function removeIrctcAccount(btn, user) {
    const username =
        String(user || "").trim();

    irctcAccounts =
        Array.isArray(irctcAccounts)
            ? irctcAccounts.filter(account => {
                const accountUsername =
                    typeof account === "string"
                        ? account
                        : String(account?.username || "").trim();

                return accountUsername !== username;
            })
            : [];

    saveStorage(
        "Boss_irctc_accounts",
        irctcAccounts
    );

    renderProfiles();
}

/* =========================================================
   SECURITY / HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}

// ==========================================
// BROWSER STATUS UI
// ==========================================

function updateBrowserStatusUI(browser) {

    const element =
        document.getElementById(
            `browser-status-${browser.type}`
        );

    if (!element) {
        return;
    }


    const name =
        browser.name || browser.type;


    if (browser.status === 'READY') {

        element.textContent = 'Ready';

        element.className =
            'text-[9px] font-semibold text-emerald-600';

        return;
    }


    if (browser.status === 'NOT_INSTALLED') {

        element.textContent =
            'Not Installed';

        element.className =
            'text-[9px] font-semibold text-slate-500';

        return;
    }


    if (browser.status === 'STOPPED') {

        element.textContent =
            'Click to Open';

        element.className =
            'text-[9px] font-semibold text-amber-600';

        return;
    }


    if (browser.status === 'ERROR') {

        element.textContent =
            'Error';

        element.className =
            'text-[9px] font-semibold text-red-600';

        return;
    }


    element.textContent =
        'Checking...';

    element.className =
        'text-[9px] font-semibold text-slate-500';
}

// ==========================================
// CONNECT / OPEN SELECTED BROWSER
// ==========================================

async function connectBrowser(browserType) {

    try {

        console.log(
            `[UI] Opening browser: ${browserType}`
        );


        const statusElement =
            document.getElementById(
                `browser-status-${browserType}`
            );


        if (statusElement) {

            statusElement.textContent =
                'Opening...';

            statusElement.className =
                'text-[9px] font-semibold text-amber-600';
        }


        if (
            !window.electronAPI ||
            !window.electronAPI.openBrowser
        ) {

            console.error(
                '[UI] openBrowser API not available.'
            );

            if (statusElement) {
                statusElement.textContent =
                    'API Error';
            }

            return;
        }


        const result =
            await window.electronAPI.openBrowser(
                browserType
            );


        console.log(
            '[UI] Browser open result:',
            result
        );


        if (
            result &&
            result.success
        ) {

            if (statusElement) {

                statusElement.textContent =
                    'Ready';

                statusElement.className =
                    'text-[9px] font-semibold text-emerald-600';
            }

            return;
        }


        if (statusElement) {

            statusElement.textContent =
                'Error';

            statusElement.className =
                'text-[9px] font-semibold text-red-600';
        }


        console.error(
            '[UI] Browser failed to open:',
            result
        );

    } catch (error) {

        console.error(
            '[UI] Browser connection error:',
            error
        );


        const statusElement =
            document.getElementById(
                `browser-status-${browserType}`
            );


        if (statusElement) {

            statusElement.textContent =
                'Error';

            statusElement.className =
                'text-[9px] font-semibold text-red-600';
        }
    }
}


// ==========================================
// REFRESH BROWSER STATUS
// ==========================================

async function refreshBrowserStatuses() {

    try {

        if (
            !window.electronAPI ||
            !window.electronAPI.getBrowserStatuses
        ) {
            return;
        }


        const result =
            await window.electronAPI.getBrowserStatuses();


        if (
            !result ||
            !result.success
        ) {
            return;
        }


        for (
            const browser of
            result.statuses || []
        ) {

            updateBrowserStatusUI(
                browser
            );

        }

    } catch (error) {

        console.error(
            '[UI] Browser status error:',
            error
        );

    }

}


async function prepareDashboardBrowsers() {
    const browserTypes = ['WEB', 'WEB2', 'WEB3'];

    try {
        console.log('[UI] prepareDashboardBrowsers() started');
        console.log('[UI] electronAPI:', window.electronAPI);
        console.log(
            '[UI] prepareBrowsers:',
            window.electronAPI?.prepareBrowsers
        );

        // Show Starting...
        for (const type of browserTypes) {
            const element = document.getElementById(
                `browser-status-${type}`
            );

            if (!element) {
                console.error(
                    `[UI] Status element missing: browser-status-${type}`
                );
                continue;
            }

            const name =
                type === 'WEB'
                    ? 'Chrome'
                    : type === 'WEB2'
                        ? 'Edge'
                        : 'Brave';

            element.textContent = `${name}: Starting...`;
            element.className =
                'px-2 py-1 rounded bg-amber-100 text-amber-700 text-[9px] font-semibold';
        }

        // Check preload API
        if (
            !window.electronAPI ||
            typeof window.electronAPI.prepareBrowsers !== 'function'
        ) {
            console.error(
                '[UI] prepareBrowsers API is not available.'
            );

            return;
        }

        console.log('[UI] Calling prepareBrowsers IPC...');

        const result =
            await window.electronAPI.prepareBrowsers();

        console.log(
            '[UI] prepareBrowsers result:',
            result
        );

        if (
            result &&
            Array.isArray(result.statuses)
        ) {
            for (const browser of result.statuses) {
                console.log(
                    '[UI] Browser status:',
                    browser
                );

                updateBrowserStatusUI(browser);
            }

            return;
        }

        console.error(
            '[UI] Invalid prepareBrowsers response:',
            result
        );

        await refreshBrowserStatuses();

    } catch (error) {

        console.error(
            '[UI] Browser preparation error:',
            error
        );

        await refreshBrowserStatuses();
    }
}

// =========================================================
// DASHBOARD TAB + WINDOW SIZE CONTROL
// =========================================================

let activeDashboardTab = null;
let dashboardIsExpanded = false;


function resizeDashboardWindow() {

    if (!window.electronAPI) return;

    const header = document.getElementById('windowHeader');
    const mainContent = document.querySelector('#mainWindow > main');

    if (!header || !mainContent) return;

    const headerHeight = Math.ceil(
        header.getBoundingClientRect().height
    );

    const contentHeight = Math.ceil(
        mainContent.getBoundingClientRect().height
    );

    const finalHeight = headerHeight + contentHeight + 2;

    console.log('[UI] Expanding Dashboard:', finalHeight);

    window.electronAPI.resizeWindow({
    width: 900,
    height: finalHeight
});

requestAnimationFrame(() => {
    document.body.style.transform = 'translateZ(0)';

    requestAnimationFrame(() => {
        document.body.style.transform = '';
    });
});
}


function minimizeDashboardWindow() {

    if (!window.electronAPI) return;

    const header = document.getElementById('windowHeader');

    if (!header) return;

    const headerHeight = Math.ceil(
        header.getBoundingClientRect().height
    );

    console.log('[UI] Minimizing Dashboard:', headerHeight);

    window.electronAPI.resizeWindow({
        width: 900,
        height: headerHeight
    });
}


function toggleTab(tabName, startup = false) {

    console.log(
        '[UI] toggleTab:',
        tabName,
        'startup:',
        startup
    );

    const mainContent =
        document.querySelector('#mainWindow > main');

    const allTabs =
        document.querySelectorAll('.tab-content');

    const allButtons =
        document.querySelectorAll('.tab-btn');


    // =====================================================
    // STARTUP
    // =====================================================

    if (startup) {

        allTabs.forEach(tab => {
            tab.style.display = 'none';
            tab.classList.remove('active');
        });

        if (mainContent) {
            mainContent.style.display = 'none';
        }

        allButtons.forEach(btn => {
            btn.classList.remove(
                'bg-indigo-600',
                'text-white',
                'shadow'
            );
        });

        const startupButton =
            document.getElementById(tabName + '-tab');

        if (startupButton) {
            startupButton.classList.add(
                'bg-indigo-600',
                'text-white',
                'shadow'
            );
        }

        activeDashboardTab = tabName;
        dashboardIsExpanded = false;

        setTimeout(() => {
            minimizeDashboardWindow();
        }, 50);

        return;
    }


    // =====================================================
    // SAME TAB CLICKED AGAIN = MINIMIZE
    // =====================================================

    if (
        activeDashboardTab === tabName &&
        dashboardIsExpanded === true
    ) {

        console.log(
            '[UI] Same tab clicked again -> MINIMIZE'
        );

        allTabs.forEach(tab => {
            tab.style.display = 'none';
            tab.classList.remove('active');
        });

        if (mainContent) {
            mainContent.style.display = 'none';
        }

        dashboardIsExpanded = false;

        minimizeDashboardWindow();

        return;
    }


    // =====================================================
    // DIFFERENT TAB / REOPEN TAB
    // =====================================================

    allTabs.forEach(tab => {
        tab.style.display = 'none';
        tab.classList.remove('active');
    });


    allButtons.forEach(btn => {
        btn.classList.remove(
            'bg-indigo-600',
            'text-white',
            'shadow'
        );
    });


    const targetTab =
        document.getElementById('tab-' + tabName);

    if (!targetTab) {

        console.error(
            '[UI] Tab nahi mila:',
            'tab-' + tabName
        );

        return;
    }


    const activeButton =
        document.getElementById(tabName + '-tab');

    if (activeButton) {

        activeButton.classList.add(
            'bg-indigo-600',
            'text-white',
            'shadow'
        );
    }


    // Main content show
    if (mainContent) {
        mainContent.style.display = 'block';
    }


    // Selected tab show
    targetTab.style.display = 'block';
    targetTab.classList.add('active');


    activeDashboardTab = tabName;
    dashboardIsExpanded = true;


    // Wait for layout, then resize
    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            resizeDashboardWindow();

        });

    });
}

<script>
document.addEventListener('DOMContentLoaded', () => {

    const updatePopup =
        document.getElementById('appUpdatePopup');

    const updateVersion =
        document.getElementById('appUpdateVersion');

    const updateNow =
        document.getElementById('appUpdateNow');

    const updateLater =
        document.getElementById('appUpdateLater');


    // ==========================================
    // NEW UPDATE AVAILABLE
    // ==========================================

    if (window.electronAPI?.onAppUpdateAvailable) {

        window.electronAPI.onAppUpdateAvailable(
            (data) => {

                if (!updatePopup) return;

                if (updateVersion) {

                    updateVersion.textContent =
                        'Version ' +
                        (data?.version || 'new');
                }

                updatePopup.classList.remove('hidden');
                updatePopup.classList.add('flex');
            }
        );
    }


    // ==========================================
    // UPDATE NOW
    // ==========================================

    if (updateNow) {

        updateNow.addEventListener(
            'click',
            () => {

                updateNow.disabled = true;
                updateNow.textContent =
                    'Downloading...';

                if (
                    window.electronAPI?.installAppUpdate
                ) {

                    window.electronAPI.installAppUpdate();
                }
            }
        );
    }


    // ==========================================
    // LATER
    // ==========================================

    if (updateLater) {

        updateLater.addEventListener(
            'click',
            () => {

                updatePopup.classList.add('hidden');
                updatePopup.classList.remove('flex');

            }
        );
    }


    // ==========================================
    // DOWNLOAD PROGRESS
    // ==========================================

    if (window.electronAPI?.onAppUpdateProgress) {

        window.electronAPI.onAppUpdateProgress(
            (data) => {

                if (!updateNow) return;

                const percent =
                    Number(data?.percent || 0);

                updateNow.textContent =
                    `Downloading ${percent}%...`;
            }
        );
    }


    // ==========================================
    // UPDATE DOWNLOADED
    // ==========================================

    if (window.electronAPI?.onAppUpdateDownloaded) {

        window.electronAPI.onAppUpdateDownloaded(
            () => {

                if (!updateNow) return;

                updateNow.disabled = false;
                updateNow.textContent =
                    'Restart & Install';

            }
        );
    }

});
</script>
